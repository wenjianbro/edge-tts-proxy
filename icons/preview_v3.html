<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><title>极简声波 — 配色方案</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Inter', sans-serif; background: #f5f5f5; color: #292524; padding: 48px 24px; }
  h1 { text-align: center; font-size: 28px; font-weight: 500; margin-bottom: 8px; letter-spacing: -0.3px; }
  .sub { text-align: center; color: #777169; font-size: 15px; margin-bottom: 48px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; max-width: 960px; margin: 0 auto; }
  .card { background: #fff; border-radius: 16px; padding: 28px 20px; text-align: center; border: 1px solid #e7e5e4; cursor: pointer; transition: all 0.2s; }
  .card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.1); transform: translateY(-2px); }
  .card.selected { border: 2px solid #292524; box-shadow: 0 4px 20px rgba(0,0,0,0.12); }
  .icons { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 16px; flex-wrap: wrap; }
  .icon-group { text-align: center; }
  .icon-group .size-label { font-size: 10px; color: #a8a29e; margin-top: 4px; letter-spacing: 0.5px; }
  .card h3 { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
  .card .color-name { font-size: 12px; color: #a8a29e; margin-bottom: 8px; }
  .color-dots { display: flex; justify-content: center; gap: 6px; margin-top: 8px; }
  .color-dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1); }
</style></head><body>

<h1>极简声波 — 配色方案</h1>
<p class="sub">方案 B 的 8 种颜色变体，点击卡片选中</p>

<div class="grid">

<div class="card">
  <h3>深海军蓝</h3>
  <div class="color-name">#1A1A2E · 经典</div>
  <div class="icons">
    <div class="icon-group">
      <svg width="80" height="80" viewBox="0 0 128 128">
        <rect width="128" height="128" rx="28" fill="#1A1A2E"/>
        <rect x="26" y="46" width="12" height="36" rx="6" fill="white" opacity="0.95"/>
        <rect x="44" y="30" width="12" height="68" rx="6" fill="white" opacity="0.95"/>
        <rect x="62" y="14" width="12" height="100" rx="6" fill="white" opacity="0.95"/>
        <rect x="80" y="46" width="12" height="36" rx="6" fill="white" opacity="0.95"/>
      </svg>
      <div class="size-label">80</div>
    </div>
  </div>
  <div class="color-dots"><span class="color-dot" style="background:#1A1A2E"></span><span class="color-dot" style="background:#fff"></span></div>
</div>
