name: Edge TTS 代理探活

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 合成探活
        run: node scripts/probe.js

      - name: 告警（失败时开 issue）
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN=$(gh issue list --state open --search 'Edge TTS 代理探活失败' --json number --jq length)
          if [ "$OPEN" -eq 0 ]; then
            gh issue create \
              --title '🚨 Edge TTS 代理探活失败' \
              --body "定时探活检测到 /synthesize 未返回有效 MP3 音频。

排查方向：Edge TTS 协议是否又变更（参考 rany2/edge-tts 最新 release / issue #490 端点迁移、PR #492 v2 令牌）。

运行日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo '已有未关闭的探活告警 issue，跳过重复创建'
          fi
