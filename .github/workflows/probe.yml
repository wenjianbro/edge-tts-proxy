name: Edge TTS proxy probe

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      proxy_url:
        description: 'Override proxy URL (leave empty for production)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe synthesize
        env:
          PROXY_URL: ${{ inputs.proxy_url }}
        run: node scripts/probe.js

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/alert.sh
