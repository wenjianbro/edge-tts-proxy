<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="header">清读 CleanRead</div>
<div class="container">
  <div class="section">
    <div class="row">
      <label class="label">语音</label>
      <select id="voiceSelect"></select>
    </div>
  </div>

  <div class="section">
    <div class="row">
      <label class="label">语速</label>
      <div class="speed-group">
        <input type="range" id="speedSlider" min="0.5" max="3.0" step="0.1" value="1.0">
        <span class="speed-value" id="speedValue">1.0x</span>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="preview-row">
      <button class="preview-btn" id="previewBtn">试听</button>
      <span class="preview-status" id="previewStatus"></span>
    </div>
  </div>

  <div class="footer">CleanRead v2.0.1</div>
</div>

<script src="../shared/constants.js"></script>
<script src="../shared/messages.js"></script>
<script src="../tts/voices.js"></script>
<script src="popup.js"></script>
</body>
</html>
